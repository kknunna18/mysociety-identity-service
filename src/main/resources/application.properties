spring.application.name=mysociety-identity-service
spring.profiles.default=dev
server.port=8081
server.servlet.context-path=/api/v1
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mysociety
spring.jpa.open-in-view=false
spring.jackson.default-property-inclusion=non_null
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.api-docs.path=/openapi
springdoc.swagger-ui.path=/swagger-ui.html
identity.jwt.secret=${IDENTITY_JWT_SECRET}
identity.jwt.access-ttl=PT15M
identity.jwt.refresh-ttl=P30D
